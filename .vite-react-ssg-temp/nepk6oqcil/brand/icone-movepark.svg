<!-- Ícone quadrado da marca, derivado de simbolo-movepark.svg.

     Existe separado porque o símbolo é 113x73 e toda plataforma renderiza ícone
     em caixa QUADRADA: usar o retangular direto deixa a marca esticada ou com
     borda torta. Aqui ele entra centralizado, com respiro nas laterais.

     O fundo é branco de propósito. Duas das cinco formas são navy (#29263F), e
     em fundo transparente elas somem no card escuro do WhatsApp e do Slack. -->
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="128" height="128" fill="#FFFFFF"/>
  <g transform="translate(6.4 26.7) scale(1.02)">
    <path d="M31.3281 72.2007H58.5883L112.091 0H84.8308L31.3281 72.2007Z" fill="#DA455E"/>
    <path d="M9.70703 72.2007H25.3143L78.7982 0H63.1909L9.70703 72.2007Z" fill="#A6DBDF"/>
    <path d="M0 72.2007H3.92435L57.4083 0H53.4839L0 72.2007Z" fill="#29263F"/>
    <path d="M94.6281 23.553L84.8229 0L77.0117 47.3174L94.6281 23.553Z" fill="#AE374B"/>
    <path d="M112.088 0H84.8281V72.2007H112.088V0Z" fill="#29263F"/>
  </g>
</svg>
