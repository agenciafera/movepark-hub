name: CI

on:
  pull_request:
  push:
    branches: [main]

# Força ações JS (ex: supabase/setup-cli@v1) a rodar no Node 24 — silencia o
# aviso de deprecação do Node 20 sem depender de release das ações upstream.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Gate obrigatório: rápido, determinístico, sem rede.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          # Pino fixo: mantém CI ↔ Cloudflare ↔ local na MESMA versão de bun.
          # O bun.lock é sensível à versão; "latest" pode derivar e quebrar o
          # deploy do Cloudflare. Mantenha em lockstep com BUN_VERSION no CF
          # (ver CLAUDE.md › "Deploy: pino de versão do bun").
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run lint:openapi
      - run: bun run test:unit

  # pgTAP contra o stack local (schema do baseline + seed). Sem segredos.
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Dois carimbos de migration iguais fazem o `supabase db reset` abortar por PK duplicada e
      # deixam de aplicar tudo dali pra frente, mascarando falhas. Já aconteceu duas vezes.
      - name: Sem timestamp de migration duplicado
        run: |
          dups=$(ls supabase/migrations/ | sed 's/_.*//' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "Migrations com timestamp duplicado:"; echo "$dups"; exit 1
          fi
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db

  # Testes das Edge Functions (Deno) — lógica pura de validação + templates.
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      # Chama o script em vez de repetir o comando: as duas cópias já derivaram
      # uma vez. O package.json ganhou `--allow-read` (o barrel.contract.test.ts
      # faz Deno.readDir) e o CI ficou para trás, quebrando o job.
      # `bun run` só executa a linha do script, não precisa de bun install.
      - run: bun run test:edge

  # Não-bloqueante: mede a cobertura e publica o relatório. Reporta, não barra.
  #
  # Fica fora do portão porque o número sozinho não diz onde está o risco: quem aponta
  # o buraco com nome e sobrenome são os três guards de inventário (mutations, rotas e
  # Edge Functions), e esses rodam no job `quality`, que barra.
  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  # Gate obrigatório: cenários Windup contra o dev server, em replay.
  #
  # Replay não chama LLM nenhum: o plano de ações vive versionado em .windup/cache e é executado
  # de forma determinística. Por isso este job não precisa de chave de modelo nem de segredo, e
  # roda em segundos. Um cache miss (cenário novo, ou plano que quebrou) precisaria planejar, e
  # sem a CLI do Claude aqui isso falha em menos de 1s com `failure [config]`. É o comportamento
  # desejado: quem escreve o cenário roda `windup run` na própria máquina e commita o plano
  # gerado junto, em .windup/cache.
  #
  # É o único gate de navegador do projeto. A suíte Playwright NÃO roda no CI de propósito:
  # ela escreve em produção e os specs transacionais cobram de verdade no Pagar.me.
  windup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      # O Chromium do Playwright é o motor do Windup; playwright-core não baixa binário sozinho.
      - run: bunx playwright install --with-deps chromium
      # Sem a chave do Google, igual à suíte Playwright: mantém o render determinístico e sem
      # chamada externa paga. A porta 5273 é a mesma que o playwright.config.ts usa.
      # VITE_CONSUMER_ACCOUNTS=on porque o Windup cobre jornada de login/conta (gated pela chave
      # de lançamento em src/lib/features.ts): sem isso, o "Entrar" some do header e os cenários
      # que dependem dele falham. Mesmo raciocínio do vi.stubEnv em src/test/setup.ts.
      - name: Sobe o dev server
        run: |
          VITE_GOOGLE_MAPS_API_KEY= VITE_CONSUMER_ACCOUNTS=on PORT=5273 bun run dev &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:5273/ && echo "dev server no ar" && exit 0
            sleep 2
          done
          echo "dev server não subiu em 180s"; exit 1
      - run: bunx windup run --all --base-url http://localhost:5273 --reporter junit --retries 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windup-report
          path: .windup/reports/

  # Não-bloqueante: bate no ambiente vivo (read-only). Cobre o motor de preço (simulate_price) e os
  # contratos das superfícies publicadas: MCP (as três superfícies, gates de sessão e de escopo),
  # busca semântica da base de conhecimento e Public API (401 sem chave, cards e openapi no ar com
  # sha256 coerente). Ver docs/specs/customer/agent-test-scenarios.md §25.
  #
  # Por que não bloqueia: depende de rede e do estado deployado. Uma instabilidade de infra ou um
  # deploy ainda não propagado travaria PRs sem relação com a mudança. O valor aqui é o sinal, não o
  # portão: se ficar vermelho, alguma superfície pública regrediu.
  # URL + anon key são públicos (anon key já vai embutida no frontend / .env versionado).
  live-integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      VITE_SUPABASE_URL: https://mgaigbezdalbyuqiofcf.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nYWlnYmV6ZGFsYnl1cWlvZmNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MTcxOTksImV4cCI6MjA5NTI5MzE5OX0.H7f344gtsOeMF3dyCQTpfBNvjPhQkKXVrhlIDmZ85LE
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run test:int
