# Config do gitleaks (secret scanning — E0.6). Estende as regras padrão e
# allowlista ruído conhecido: a anon key do Supabase é PÚBLICA por design (vai no
# bundle do front), então não é segredo. Qualquer OUTRO JWT/segredo é flagado.
[extend]
useDefault = true

[allowlist]
description = "Valores públicos conhecidos (não são segredos)"
# A anon key vive em .env (template) e no ci.yml (build) — pública por design.
paths = [
  '''^\.env$''',
  # Fixtures de teste com chaves MOCK (não são segredos reais):
  #  - key_prefix "mp_live_…" (só o prefixo público de uma API key)
  #  - const KEY base64 de "secret-key-1234567890" (valor de teste do roundtrip)
  '''src/features/api-keys/ApiKeysTable\.test\.tsx$''',
  '''supabase/functions/send-whatsapp-otp/webhook\.test\.ts$''',
  # Coleção Postman LEGADO da API v3.0 (Stripe sk_test_ / JWTs expirados). Removida da
  # árvore, mas o gitleaks varre o histórico — o allowlist por caminho cobre os commits
  # antigos onde o arquivo existia.
  '''docs/Movepark v3\.0\.postman_collection\.json$''',
  # Cenários e cache de plano do Windup: sessão FALSA semeada no localStorage (JWT sem
  # assinatura, "windup-nao-assinado"/".x", exp 2100). O gitleaks acusa 150 achados da
  # regra jwt no commit que os criou (31/07/2026) e deixava o scan sem sinal.
  '''^e2e/windup/.*\.json$''',
  '''^\.windup/cache/trajetorias/.*\.json$''',
  # .mcp.json: a chave do Gemini saiu do arquivo em eddcb73c (hoje é env var), mas o
  # commit c71b5693 fica no histórico; a chave foi rotacionada.
  '''^\.mcp\.json$''',
  # Testes de Edge com token/JWT FALSO montado no próprio teste (resolver do MCP, parse do segredo
  # do link de acesso) e a página de documentação da API interna, que mostra um curl de exemplo
  # com header Authorization e placeholder.
  '''^supabase/functions/mcp/resolver\.test\.ts$''',
  '''^supabase/functions/redeem-company-access-link/logic\.test\.ts$''',
  '''^src/routes/manager/api-interna\.tsx$''',
]
regexes = [
  # Leitura de app_setting pelo nome da chave (`.eq("key", "go2park_leads_inbox")`): é o NOME de
  # uma configuração, não um segredo. A regra generic-api-key acusa pela palavra "key".
  '''\.eq\("key", "[a-z0-9_]+"\)''',
  # JWT com claim "role":"anon" — chave pública do Supabase.
  '''eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*cm9sZSI6ImFub24[A-Za-z0-9_-]*\.[A-Za-z0-9_-]+''',
]
