<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/simbolo-movepark.svg" />
    <!-- viewport-fit=cover é o que faz `env(safe-area-inset-*)` valer no iOS. Sem ele
         o inset volta 0 e a barra inferior fica colada no indicador de home. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Google Tag Manager. Fica o mais alto possível no head, como o GTM pede. O
         container é GTM-KHBBZT9; o ID é público (vai no HTML), então não é env var.
         O script é async: não bloqueia o paint nem o script de tema abaixo.
         A CSP em public/_headers precisa liberar googletagmanager.com. -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-KHBBZT9");
    </script>
    <!-- End Google Tag Manager -->
    <!-- Tema (claro/grafite): aplica a classe antes do paint pra não piscar. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("mp-theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- O titulo da pagina e gerido pelo Helmet: defaultTitle em AppProviders como
         fallback e cada pagina define o seu. Nao declare um estatico aqui para nao
         duplicar a tag no head. -->
    <!--app-head-->
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-KHBBZT9"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe
    ></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
